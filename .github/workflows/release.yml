# Windows-ის exe-ს აწყობა და GitHub Release-ზე ატვირთვა.
# იშვება, როცა git-ზე v-ით დაწყებულ თეგს აგზავნი (მაგ. v1.0.0),
# ან ხელით: Actions → Build Windows → Run workflow.
name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build exe
        run: npm run dist

      # ყოველთვის ინახება Actions-ის გვერდზე (Artifacts), ხელით გაშვებისასაც
      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-windows
          path: release/*.exe

      # თეგზე — იქმნება Release და exe-ები მას ემაგრება
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
