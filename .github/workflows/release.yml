# Windows / macOS / Linux build-ები და GitHub Release.
#
# ძირითადი გზა: package.json-ში ცვლი "version"-ს და master-ზე აგზავნი (push).
# თუ Release v<version> ჯერ არ არსებობს, სამივე სისტემაზე პარალელურად აეწყობა,
# შემდეგ შეიქმნება თეგი და Release და ყველა ფაილი დაემაგრება:
#   NetWatch-Setup.exe, NetWatch-Portable.exe   — Windows
#   NetWatch-mac.dmg                            — macOS (Intel + Apple Silicon)
#   NetWatch-linux.AppImage                     — Linux
#   latest.yml, latest-linux.yml, *.blockmap    — ავტომატური განახლებისთვის (აპი ამათ ამოწმებს)
# ვერსია თუ არ შეცვლილა, აწყობა გამოტოვდება.
#
# ასევე იშვება:
#   - როცა GitHub-ის საიტზე Release-ს ხელით ქმნი — ფაილები ემაგრება იმ Release-ს
#   - ხელით: Actions → Build → Run workflow
#     (tag ცარიელი = package.json-ის ვერსია; ან მიუთითე არსებული, მაგ. v1.0.0)
name: Build

on:
  push:
    branches: [master]
    paths: [package.json]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-ის თეგი (მაგ. v1.0.0). ცარიელი — package.json-ის ვერსია'
        required: false

permissions:
  contents: write

jobs:
  # რომელ ვერსიაზეა საუბარი და საჭიროა თუ არა აწყობა
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION_TAG="v$(node -p "require('./package.json').version")"
          TAG="${RELEASE_TAG:-${INPUT_TAG:-$VERSION_TAG}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # თეგი უკვე არსებობს → კოდს მისგან ვაწყობთ; არა → მიმდინარე commit-იდან (თეგი აქ შეიქმნება)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          # push-ზე: Release უკვე არსებობს → ვერსია არ შეცვლილა, აწყობა არ გვჭირდება
          if [ "${{ github.event_name }}" = "push" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG უკვე არსებობს — package.json-ში ვერსია გაზარდე ახალი Release-სთვის"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ვაწყობ $TAG"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ESLint — იგივე, რაც commit-ის წინ (husky); შეცდომისას Release არ აეწყობა
  lint:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # სამი სისტემა პარალელურად; თითოეული თავის ფაილებს Artifacts-ში ტვირთავს
  build:
    needs: [version, lint]
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false # ერთის ჩავარდნა დანარჩენებს არ აჩერებს
      matrix:
        include:
          # *.yml და *.blockmap — ავტომატური განახლებისთვის (electron-updater კითხულობს)
          - name: windows
            os: windows-latest
            script: dist:win
            files: |
              release/*.exe
              release/latest.yml
              release/*.exe.blockmap
          - name: mac
            os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
          - name: linux
            os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      # ხელმოწერის სერტიფიკატს არ ვეძებთ — macOS-ზე ad-hoc ხელმოწერა (identity "-")
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (${{ matrix.name }})
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-${{ needs.version.outputs.tag }}-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # ყველა ფაილი ერთად — ერთი Release (პარალელური job-ები ერთმანეთს რომ არ შეეჯახონ)
  release:
    needs: [version, build]
    # ერთი სისტემა თუ ჩავარდა, დანარჩენები მაინც გამოქვეყნდება
    if: always() && needs.version.outputs.build == 'true' && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Files
        run: ls -la release

      # თეგი თუ არ არსებობს — შეიქმნება ამ commit-ზე; Release — ასევე
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
