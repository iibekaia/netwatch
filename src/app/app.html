<main class="mx-auto flex min-h-screen max-w-[560px] flex-col gap-5 px-5 pt-6 pb-4">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="grid size-8 place-items-center rounded-[10px] bg-text text-bg" aria-hidden="true">
        <app-icon name="globe" class="size-[18px]" />
      </span>
      <h1 class="text-[17px] font-semibold tracking-tight">NetWatch</h1>
    </div>

    <!-- მიმდინარე მდგომარეობა — ყველა ტაბიდან ჩანს -->
    <span class="inline-flex items-center gap-1.5 rounded-full bg-card px-2.5 py-1 text-xs text-muted shadow-soft ring-1 ring-border">
      <span class="size-1.5 rounded-full" [class]="statusDot()"></span>
      {{ statusText() }}
    </span>
    <!--    @if (conn.isElectron) {-->
    <!--      <button class="btn-soft" (click)="conn.toggleDevTools()" title="F12 / Ctrl+Shift+I">-->
    <!--        Inspect-->
    <!--      </button>-->
    <!--    }-->
  </header>

  <!-- ქსელი და სიჩქარე მხოლოდ Electron-შია (ბრაუზერში — მხოლოდ კავშირი) -->
  @if (lan.available) {
    <app-tab-nav [(active)]="tab" />
  }

  @switch (tab()) {
    @case ('lan') {
      <app-lan-tab />
    }
    @case ('speed') {
      <app-speed-tab />
    }
    @default {
      <app-status-tab />
    }
  }

  <footer class="mt-auto text-center text-[11px] text-muted/70">
    @if (versions) {
      Electron {{ versions.electron }} · Chrome {{ versions.chrome }} · Node {{ versions.node }}
    } @else {
      ბრაუზერის რეჟიმი — მხოლოდ navigator.onLine
    }
  </footer>
</main>

<app-toasts />
