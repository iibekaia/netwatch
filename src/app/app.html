<main class="mx-auto flex min-h-screen max-w-[560px] flex-col gap-4 px-5 pt-5 pb-3">
  <header class="flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span
        class="size-[22px] rounded-md bg-[conic-gradient(from_200deg,var(--ok),var(--accent),var(--ok))]"
        aria-hidden="true"
      ></span>
      <h1 class="text-lg font-bold tracking-wide">NetWatch</h1>
    </div>
    @if (conn.isElectron) {
      <button class="btn-ghost" (click)="conn.toggleDevTools()" title="F12 / Ctrl+Shift+I">
        Inspect
      </button>
    }
  </header>

  <!-- ქსელი და სიჩქარე მხოლოდ Electron-შია (ბრაუზერში — მხოლოდ კავშირი) -->
  @if (lan.available) {
    <app-tab-nav [(active)]="tab" />
  }

  @switch (tab()) {
    @case ('lan') {
      <app-lan-tab />
    }
    @case ('speed') {
      <app-speed-tab />
    }
    @default {
      <app-status-tab />
    }
  }

  <footer class="text-center text-[11px] text-muted">
    @if (versions) {
      Electron {{ versions.electron }} · Chrome {{ versions.chrome }} · Node {{ versions.node }}
    } @else {
      ბრაუზერის რეჟიმი — მხოლოდ navigator.onLine
    }
  </footer>
</main>

<app-toasts />
