<div class="mb-1.5 flex items-baseline justify-between">
  <span class="caption">{{ icon() }} {{ label() }}</span>
  <span class="stat" [class.text-accent]="active()">{{ display() }}<small>Mbps</small></span>
</div>

<div
  class="relative h-3 overflow-hidden rounded-full bg-muted/16"
  role="meter"
  [attr.aria-label]="label()"
  aria-valuemin="0"
  aria-valuemax="1000"
  [attr.aria-valuenow]="value() ?? 0"
>
  <span
    class="absolute inset-y-0 left-0 overflow-hidden rounded-full bg-linear-to-r transition-[width] duration-250 ease-out"
    [class]="fill()"
    [style.width.%]="percent()"
  >
    @if (active()) {
      <span class="absolute inset-0 animate-shimmer bg-linear-to-r from-transparent via-white/35 to-transparent"></span>
    }
  </span>
</div>

<div class="relative mt-[3px] h-3.5 text-[10px] text-muted" aria-hidden="true">
  @for (t of ticks; track t.label) {
    <span class="absolute" [class]="t.pos">{{ t.label }}</span>
  }
</div>
