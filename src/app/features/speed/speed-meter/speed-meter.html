<div class="mb-3 flex items-end justify-between">
  <span class="flex items-center gap-2 text-[13px] text-muted">
    <span class="grid size-6 place-items-center rounded-md" [class]="tone().text" aria-hidden="true">
      <app-icon [name]="icon()" class="size-3.5" />
    </span>
    {{ label() }}
  </span>
  <span class="stat" [class.text-muted/40]="value() === undefined">{{ display() }}<small>Mbps</small></span>
</div>

<div
  class="relative h-1.5 overflow-hidden rounded-full bg-subtle"
  role="meter"
  [attr.aria-label]="label()"
  aria-valuemin="0"
  aria-valuemax="1000"
  [attr.aria-valuenow]="value() ?? 0"
>
  <span
    class="absolute inset-y-0 left-0 overflow-hidden rounded-full transition-[width] duration-300 ease-out"
    [class]="tone().bar"
    [style.width.%]="percent()"
  >
    @if (active()) {
      <span class="absolute inset-0 animate-shimmer bg-linear-to-r from-transparent via-white/50 to-transparent"></span>
    }
  </span>
</div>

<div class="relative mt-1.5 h-3.5 text-[10px] text-muted/70 tabular-nums" aria-hidden="true">
  @for (t of ticks; track t.label) {
    <span class="absolute" [class]="t.pos">{{ t.label }}</span>
  }
</div>
