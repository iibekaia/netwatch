<div class="flex items-start justify-between">
  <div class="flex min-w-0 flex-col gap-0.5">
    <span class="caption">პროვაიდერი</span>
    <strong class="truncate text-[17px]">
      {{ provider()?.isp ?? (loading() ? 'იტვირთება…' : '—') }}
    </strong>
    @if (provider()?.network; as network) {
      <span class="truncate text-xs text-muted">{{ network }}</span>
    }
  </div>
  <button class="btn-link" (click)="refresh.emit()" [disabled]="loading()">განახლება</button>
</div>

@if (rows().length) {
  <dl class="mt-3 grid grid-cols-2 gap-x-4 gap-y-2.5">
    @for (r of rows(); track r.label) {
      <div class="min-w-0">
        <dt class="text-[11px] text-muted">{{ r.label }}</dt>
        <dd class="mt-0.5 truncate text-[13px]" [class.font-mono]="r.mono">{{ r.value || '—' }}</dd>
      </div>
    }
  </dl>
}
