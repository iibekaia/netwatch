@let d = device();

<span class="grid size-9 place-items-center rounded-[10px]" [class]="iconTone()" aria-hidden="true">
  <app-icon [name]="icon()" class="size-[18px]" />
</span>

<div class="flex min-w-0 flex-col gap-0.5">
  <div class="flex flex-wrap items-center gap-1.5">
    <span class="max-w-full truncate text-sm font-medium">{{ name() }}</span>
    @if (d.self) {
      <span class="tag bg-accent/10 text-accent">ეს კომპიუტერი</span>
    }
    @if (d.gateway) {
      <span class="tag bg-subtle text-muted">როუტერი</span>
    }
    @if (d.peer) {
      <span class="tag bg-ok/12 text-ok">NetWatch {{ d.peer.version }}</span>
    }
  </div>

  @if (d.peer) {
    <div class="flex items-center gap-1 truncate text-xs text-text/80">
      <app-icon name="user" class="size-3" />
      {{ d.peer.user }} · {{ d.peer.host }} · {{ platform(d.peer.platform) }}
    </div>
  }
  <div class="truncate font-mono text-[11.5px] text-muted">
    {{ d.ip }}
    @if (d.mac) {
      <span class="text-muted/60">·</span> {{ d.mac }}
    }
  </div>
  @if (extra()) {
    <div class="truncate text-xs text-muted">{{ extra() }}</div>
  }
</div>
