@let s = conn.status();

<!-- მოკლე მდგომარეობა: რამდენ ხანს, დაყოვნება, ბოლო შემოწმება -->
<section class="card" [class]="conn.online() === false ? 'border-bad/25! bg-bad/5!' : ''">
  <div class="min-w-0">
    <p class="truncate text-[15px] font-semibold tracking-tight" [class.text-bad]="conn.online() === false">
      {{ title() }}
    </p>
    <p class="mt-0.5 truncate text-xs text-muted">
      {{ reason() }}
      @if (s.latencyMs !== null) {
        · <span class="tabular-nums">{{ s.latencyMs }} ms</span>
      }
      @if (s.lastCheck) {
        · <span class="tabular-nums">{{ i18n.t('conn.checkedAt', { time: i18n.date(s.lastCheck, 'time') }) }}</span>
      }
    </p>
  </div>
</section>

<app-diagnostics-card />
