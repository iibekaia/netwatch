<section
  class="rounded-[18px] border px-5 pt-7 pb-[22px] text-center transition-colors duration-300"
  [class]="tone().card"
  aria-live="polite"
>
  <!-- პულსირებადი წერტილი: ონლაინ — ტალღები, ოფლაინ — ციმციმი -->
  <div class="relative mx-auto mb-3.5 grid size-[84px] place-items-center" aria-hidden="true">
    @if (conn.online() === true) {
      <span class="absolute inset-0 animate-ripple rounded-full opacity-0" [class]="tone().bg"></span>
      <span
        class="absolute inset-0 animate-ripple rounded-full opacity-0 [animation-delay:1.2s]"
        [class]="tone().bg"
      ></span>
    } @else if (conn.online() === false) {
      <span class="absolute inset-0 animate-blink rounded-full opacity-0" [class]="tone().bg"></span>
    }
    <span class="relative size-[34px] rounded-full transition-colors duration-300" [class]="tone().dot"></span>
  </div>

  <p class="m-0 text-3xl font-bold" [class]="tone().text">{{ stateLabel() }}</p>
  <p class="mt-1 text-sm text-muted">{{ reasonLabel() }}</p>
  <p class="mt-3.5 text-sm text-muted">
    {{ conn.online() === false ? 'გათიშულია' : 'ჩართულია' }} უკვე
    <strong class="text-text tabular-nums">{{ duration() }}</strong>
  </p>
</section>

<section class="grid grid-cols-3 gap-2.5">
  @for (m of metrics(); track m.label) {
    <div class="flex min-w-0 flex-col gap-1 rounded-xl border border-border bg-card px-3 py-2.5">
      <span class="truncate text-[11px] text-muted">{{ m.label }}</span>
      <span class="text-base font-semibold tabular-nums">{{ m.value }}</span>
    </div>
  }
</section>

<button class="btn-primary" (click)="conn.checkNow()" [disabled]="conn.checking()">
  {{ conn.checking() ? 'მოწმდება…' : 'შეამოწმე ახლავე' }}
</button>

<app-event-log class="flex min-h-0 flex-1 flex-col" [events]="conn.events()" (clear)="conn.clearLog()" />
