@for (t of tabs; track t.id) {
  @let selected = active() === t.id;
  <button
    role="tab"
    class="flex h-9 min-w-0 items-center justify-center gap-1.5 rounded-[10px] px-1.5 text-[13px] font-medium transition"
    [class]="selected ? 'bg-raised text-text shadow-soft' : 'text-muted hover:text-text'"
    [attr.aria-selected]="selected"
    (click)="active.set(t.id)"
  >
    <app-icon [name]="t.icon" class="size-4" />
    <span class="truncate">{{ i18n.t('tabs.' + t.id) }}</span>

    @switch (t.id) {
      @case ('lan') {
        <!-- მოწყობილობების რაოდენობა ტაბის შიგნით ჩანს; აქ — მხოლოდ NetWatch-ის მომხმარებლები
             (გრძელ ენებზე, მაგ. უკრაინულზე, სახელი რომ არ მოიჭრას) -->
        @if (lan.peerCount()) {
          <span class="badge bg-ok/12 text-ok" [title]="i18n.t('tabs.peers')">{{ lan.peerCount() }}</span>
        }
      }
      @case ('speed') {
        @if (speed.running()) {
          <span class="relative flex size-1.5">
            <span class="absolute inset-0 animate-ping-soft rounded-full bg-accent"></span>
            <span class="relative size-1.5 rounded-full bg-accent"></span>
          </span>
        }
      }
    }
  </button>
}
